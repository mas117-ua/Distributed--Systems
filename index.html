<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi City Map</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #map-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            padding: 20px;
            background: #f8f9fa;
        }
        .overlap-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2px;
            height: 100%;
        }

        .overlap-cell .destination-id {
            font-size: 13px;
            color: white;
            background-color: #0d6efd;
            padding: 1px 3px;
            border-radius: 2px;
            margin-bottom: 1px;
        }

        .overlap-cell .client-id {
            font-size: 11px;
            color: black;
            background-color: #ffc107;
            padding: 1px 3px;
            border-radius: 2px;
        }

        .map-row {
            display: flex;
            gap: 1px;
        }
        .map-cell {
            width: 35px;
            height: 35px;
            border: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            background: white;
            position: relative; /* Add this for overlapping content */
        }
        .map-cell:empty {
            background: #f8f9fa;
        }
        .taxi-cell {
            font-weight: bold;
        }
        .taxi-cell-rojo {
            background-color: #dc3545;
            color: white;
        }
        .taxi-cell-verde {
            background-color: #198754;
            color: white;
        }
        .client-cell {
            background-color: #ffc107;
            color: black;
            font-weight: bold;
        }
        .destination-cell {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
        }
        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-box {
            width: 20px;
            height: 20px;
            border: 1px solid #dee2e6;
        }
        .legend-taxi-rojo {
            background-color: #dc3545;
        }
        .legend-taxi-verde {
            background-color: #198754;
        }
        .legend-client {
            background-color: #ffc107;
        }
        .legend-destination {
            background-color: #0d6efd;
        }
         .system-status {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .temperature-warning {
            color: #dc3545;
            font-weight: bold;
        }

        .temperature-normal {
            color: #198754;
            font-weight: bold;
        }

        .status-badge {
            font-size: 0.9em;
            padding: 5px 10px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">City Taxi Map</h1>

        <!-- System Status Section -->
        <div class="system-status mb-4">
            <div class="row">
                <div class="col-md-4">
                    <div id="temperature-status" class="h5"></div>
                </div>
                <div class="col-md-4">
                    <div id="taxi-stats" class="h6"></div>
                </div>
                <div class="col-md-4">
                    <div id="ctc-status" class="h6"></div>
                </div>
            </div>
        </div>

        <!-- Your existing legend -->
        <div class="legend">
            <!-- Keep existing legend items -->
        </div>

        <div class="row">
            <!-- Map Column -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Map View</h5>
                        <div id="map-container" class="d-flex justify-content-center"></div>
                    </div>
                </div>
            </div>

            <!-- Tables Column -->
            <div class="col-md-4">
                <!-- Taxi Status Table -->
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Taxi Status</h5>
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Taxi ID</th>
                                        <th>Estado</th>
                                        <th>Position</th>
                                    </tr>
                                </thead>
                                <tbody id="taxi-list">
                                    <!-- Taxi data will be inserted here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Client Destinations Table -->
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Client Destinations</h5>
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Client ID</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="client-destinations-list">
                                    <!-- Client destinations will be inserted here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
